name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    # cron 为 UTC，北京时间 = UTC+8。三个时段分别对应 08:00 / 09:00 / 16:00。
    - cron: "0 0 * * *"   # 北京 08:00  第一次签到：成功通知，失败静默
    - cron: "0 1 * * *"   # 北京 09:00  首签失败后 1 小时重试：成功通知，失败静默
    - cron: "0 8 * * *"   # 北京 16:00  最后补签：成功通知，失败也通知

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config
        run: |
          cat > config.yml <<'EOF'
          accounts:
            - name: default
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          EOF

      - name: Resolve schedule slot
        id: slot
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *") SLOT="morning" ;;
            "0 1 * * *") SLOT="retry" ;;
            "0 8 * * *") SLOT="evening" ;;
            *)           SLOT="manual" ;;
          esac
          echo "name=$SLOT" >> "$GITHUB_OUTPUT"
          echo "本次时段：$SLOT"

      - name: Check if already checked in today
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ -f status.txt ] && [ "$(cat status.txt)" = "$TODAY" ]; then
            echo "今天（$TODAY）已签到，跳过本次运行"
            echo "already=1" >> "$GITHUB_OUTPUT"
          else
            echo "今天尚未签到，继续执行"
            echo "already=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run check-in
        id: checkin
        if: steps.guard.outputs.already == '0'
        shell: bash
        run: |
          set +e
          python run.py --once > checkin.out 2>&1
          STATUS=$?
          cat checkin.out
          if [ $STATUS -eq 0 ]; then
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            echo "$TODAY" > status.txt
          fi
          exit $STATUS

      - name: Commit check-in status
        if: steps.guard.outputs.already == '0' && steps.checkin.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.txt
          git commit -m "chore: 记录今日签到 $(TZ=Asia/Shanghai date +%Y-%m-%d)" || echo "无变更"
          git push

      - name: Notify
        if: always() && steps.guard.outputs.already == '0'
        shell: bash
        run: |
          OUTCOME="${{ steps.checkin.outcome }}"
          SLOT="${{ steps.slot.outputs.name }}"
          set +o pipefail

          if [ "$OUTCOME" = "success" ]; then
            if grep -q '^⏭️ ' checkin.out; then
              # 服务器返回"今日已签到"：本次并未真正签到，文案须如实反映
              TITLE="⏭️ 禁漫天堂今日已签到（未执行签到）"
            elif [ "$SLOT" = "morning" ]; then
              TITLE="✅ 禁漫天堂签到成功（08:00）"
            elif [ "$SLOT" = "retry" ]; then
              TITLE="✅ 禁漫天堂签到成功（09:00 重试）"
            elif [ "$SLOT" = "evening" ]; then
              TITLE="✅ 禁漫天堂签到成功（16:00 补签）"
            else
              TITLE="✅ 禁漫天堂签到成功（手动触发）"
            fi
            DESP=$(grep -E '^(✅|⏭️) ' checkin.out | tail -n 1 || true)
            [ -z "$DESP" ] && DESP="签到接口已返回成功"
          else
            case "$SLOT" in
              morning|retry)
                # 08:00 / 09:00 失败都静默，等后面的时段接手
                echo "$SLOT 时段签到失败，按规则静默，等待下一个时段"
                exit 0
                ;;
              *)
                # 16:00 补签仍失败，或手动触发失败：需要人工处理
                TITLE="⚠️ 今日签到失败，请手动签到"
                DESP=$(tail -n 12 checkin.out)
                ;;
            esac
          fi

          curl -s -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${DESP}"
