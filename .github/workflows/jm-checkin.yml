name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 13 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config
        run: |
          cat > config.yml <<'EOF'
          accounts:
            - name: default
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          EOF

      - name: Check if already checked in today
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ -f status.txt ] && [ "$(cat status.txt)" = "$TODAY" ]; then
            echo "今天（$TODAY）已签到，跳过本次运行"
            echo "already=1" >> "$GITHUB_OUTPUT"
          else
            echo "今天尚未签到，继续执行"
            echo "already=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run check-in
        id: checkin
        if: steps.guard.outputs.already == '0'
        shell: bash
        run: |
          set +e
          python run.py --once > checkin.out 2>&1
          STATUS=$?
          cat checkin.out
          if [ $STATUS -eq 0 ]; then
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            echo "$TODAY" > status.txt
          fi
          exit $STATUS

      - name: Commit check-in status
        if: steps.guard.outputs.already == '0' && steps.checkin.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.txt
          git commit -m "chore: 记录今日签到 $(TZ=Asia/Shanghai date +%Y-%m-%d)" || echo "无变更"
          git push

      - name: Notify
        if: always() && steps.guard.outputs.already == '0'
        shell: bash
        run: |
          OUTCOME="${{ steps.checkin.outcome }}"
          HOUR=$(date -u +%H | sed 's/^0//')
          if [ "$OUTCOME" = "success" ]; then
            TITLE="✅ 禁漫天堂签到成功"
            DESP=$(grep -E '^(✅|❌) ' checkin.out | tail -n 1 || true)
            [ -z "$DESP" ] && DESP="今日签到已完成"
          elif [ "$HOUR" -lt 6 ]; then
            echo "早上签到失败，静默等待晚上重试，不发送通知"
            exit 0
          else
            TITLE="⚠️ 今日签到彻底失败，请手动处理"
            DESP=$(tail -n 12 checkin.out)
          fi
          curl -s -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${DESP}"
